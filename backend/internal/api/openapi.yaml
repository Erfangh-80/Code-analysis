openapi: 3.1.0
info:
  title: Code Risk Analyzer Local API
  version: 0.1.0
  license:
    name: License not selected
    url: https://github.com/Erfangh-80/Code-analysis
  description: |
    Local-only API for Code Risk Analyzer. The static-analysis endpoint reads
    source files from a rootPath on the same machine as this Go service. It
    never accepts repository source content in the request and never executes
    files it reads.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Default local-only server
security: []
paths:
  /health:
    get:
      summary: Check local API availability
      operationId: health
      responses:
        '200':
          description: Local service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /static-analysis:
    post:
      summary: Analyze selected local source files statically
      operationId: analyzeStaticFiles
      description: |
        Reads only the relative files named under rootPath. Supported languages
        are Go (.go), JavaScript (.js, .mjs, .cjs), and Python (.py). Parser
        errors are returned honestly; a fallback result is flagged and recorded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticAnalysisRequest'
      responses:
        '200':
          description: Real static metrics and directory-level aggregations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAnalysis'
        '400':
          description: Invalid root path, unsafe relative file path, or malformed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /static-analysis/failures:
    get:
      summary: List files with parser or local-read failures
      operationId: listStaticAnalysisFailures
      responses:
        '200':
          description: Safe metadata for failures observed by this local process
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FailureRecord'
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /openapi.yaml:
    get:
      summary: Download the local Swagger/OpenAPI definition
      operationId: openApiDocument
      responses:
        '200':
          description: Swagger-compatible OpenAPI document
          content:
            application/yaml:
              schema:
                type: string
        '405':
          description: Method not allowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          example: ok
        version:
          type: string
          example: 0.1.0
    StaticAnalysisRequest:
      type: object
      additionalProperties: false
      required: [rootPath, files]
      properties:
        rootPath:
          type: string
          description: Absolute local directory path visible to the Go process.
          example: /workspace/repository
        files:
          type: array
          minItems: 1
          description: Repository-relative paths. Absolute and root-escaping paths are rejected.
          items:
            type: string
          example: [internal/api/server.go, web/app.js]
    BatchAnalysis:
      type: object
      required: [files, modules]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileAnalysis'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAnalysis'
    FileAnalysis:
      type: object
      required: [path, language, status, usedFallback, metrics, functions, classes, diagnostics]
      properties:
        path:
          type: string
          example: internal/api/server.go
        language:
          type: string
          enum: [go, javascript, python, unknown]
        status:
          type: string
          enum: [analyzed, empty, no_executable_code, fallback, parse_error, unsupported, read_error]
        usedFallback:
          type: boolean
        metrics:
          $ref: '#/components/schemas/Metrics'
        functions:
          type: array
          items:
            $ref: '#/components/schemas/Declaration'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Declaration'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    ModuleAnalysis:
      type: object
      required: [path, fileCount, failedFileCount, metrics]
      properties:
        path:
          type: string
          example: internal/api
        fileCount:
          type: integer
          minimum: 0
        failedFileCount:
          type: integer
          minimum: 0
        metrics:
          $ref: '#/components/schemas/Metrics'
    Metrics:
      type: object
      required: [linesOfCode, functionCount, classCount, functionLength, classLength]
      properties:
        linesOfCode:
          type: integer
          minimum: 0
        functionCount:
          type: integer
          minimum: 0
        classCount:
          type: integer
          minimum: 0
        functionLength:
          $ref: '#/components/schemas/LengthSummary'
        classLength:
          $ref: '#/components/schemas/LengthSummary'
    LengthSummary:
      type: object
      required: [max, total]
      properties:
        max:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Declaration:
      type: object
      required: [name, kind, startLine, endLine, length]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [function, method, class]
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        length:
          type: integer
          minimum: 0
    Diagnostic:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, error]
    FailureRecord:
      type: object
      required: [path, language, status, usedFallback, diagnostics, recordedAt]
      properties:
        path:
          type: string
        language:
          type: string
        status:
          type: string
        usedFallback:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        recordedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
