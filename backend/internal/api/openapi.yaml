openapi: 3.1.0
info:
  title: Code Risk Analyzer Core API
  version: 0.1.0-core
  license:
    name: License not selected
    url: https://github.com/Erfangh-80/Code-analysis
  description: |
    Local-only API for the first four project phases: requirements-backed static
    analysis, Git-history facts, and explainable hotspot scoring. Every path is
    resolved on the same machine as this Go service. Source code is never
    uploaded or executed.
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Default local-only server
security: []
paths:
  /health:
    get:
      summary: Check local API availability
      operationId: health
      responses:
        '200':
          description: Local service is available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /static-analysis:
    post:
      summary: Analyze local source files below one root directory
      operationId: analyzeStaticFiles
      description: |
        Reads source files below an absolute rootPath. When files is omitted or
        empty, the server performs a bounded discovery of supported Go,
        JavaScript, and Python sources below rootPath, skipping VCS metadata,
        dependency vendors, and build output directories; explicit relative
        paths restrict analysis to exactly those files. The target project is
        never built, imported, tested, or executed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaticAnalysisRequest'
      responses:
        '200':
          description: Actual static metrics and module aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchAnalysis'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: A configured local resource limit was exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /static-analysis/failures:
    get:
      summary: List safe static-analysis failures observed by this process
      operationId: listStaticAnalysisFailures
      responses:
        '200':
          description: Parser/read failure metadata without source contents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/FailureRecord'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /git-analysis:
    post:
      summary: Analyze existing local Git history
      operationId: analyzeGitHistory
      description: |
        Uses read-only Git history commands against an existing local worktree.
        Omit history bounds to inspect all commits reachable from HEAD.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GitAnalysisRequest'
      responses:
        '200':
          description: Per-file change history metrics, including rename/deletion facts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GitAnalysisReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '413':
          description: A configured Git resource limit was exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: The local Git history could not be analyzed completely
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /risk-analysis:
    post:
      summary: Calculate explainable hotspot scores from static and Git facts
      operationId: calculateRiskHotspots
      description: |
        Scores caller-supplied analytical facts deterministically. It does not
        read source, invoke Git, execute a project, or contact a remote service.
        Omit profile to use the versioned risk-v1 defaults.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RiskAnalysisRequest'
      responses:
        '200':
          description: Ranked hotspots, metric contributions, modules, and heatmap cells
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskAnalysisReport'
        '400':
          $ref: '#/components/responses/ValidationError'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
  /openapi.yaml:
    get:
      summary: Download this OpenAPI document
      operationId: openApiDocument
      responses:
        '200':
          description: OpenAPI 3.1 YAML document
          content:
            application/yaml:
              schema:
                type: string
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
components:
  responses:
    ValidationError:
      description: Invalid, inaccessible, or unsafe local input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MethodNotAllowed:
      description: Method not allowed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    HealthResponse:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    StaticAnalysisRequest:
      type: object
      additionalProperties: false
      required: [rootPath]
      properties:
        rootPath:
          type: string
          description: Absolute local directory allowed by the server policy.
        files:
          type: array
          description: |
            Optional non-empty project-relative paths below rootPath. Omit or
            pass an empty list to let the server discover supported source
            files below rootPath within its configured file-count limit.
          items:
            type: string
            minLength: 1
    SupportedLanguage:
      type: string
      enum: [go, javascript, python, unknown]
    FileAnalysisStatus:
      type: string
      enum: [analyzed, empty, no_executable_code, fallback, parse_error, unsupported, read_error]
    MetricLength:
      type: object
      required: [max, total]
      properties:
        max:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
    Metrics:
      type: object
      required: [linesOfCode, functionCount, classCount, functionLength, classLength]
      properties:
        linesOfCode:
          type: integer
          minimum: 0
        functionCount:
          type: integer
          minimum: 0
        classCount:
          type: integer
          minimum: 0
        functionLength:
          $ref: '#/components/schemas/MetricLength'
        classLength:
          $ref: '#/components/schemas/MetricLength'
    Diagnostic:
      type: object
      required: [code, message, severity]
      properties:
        code:
          type: string
        message:
          type: string
        severity:
          type: string
          enum: [warning, error]
    Declaration:
      type: object
      required: [name, kind, startLine, endLine, length]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [function, method, class]
        startLine:
          type: integer
          minimum: 1
        endLine:
          type: integer
          minimum: 1
        length:
          type: integer
          minimum: 1
    FileAnalysis:
      type: object
      required: [path, language, status, usedFallback, metrics, functions, classes, diagnostics]
      properties:
        path:
          type: string
          description: Project-relative slash-normalized path.
        language:
          $ref: '#/components/schemas/SupportedLanguage'
        status:
          $ref: '#/components/schemas/FileAnalysisStatus'
        usedFallback:
          type: boolean
        metrics:
          $ref: '#/components/schemas/Metrics'
        functions:
          type: array
          items:
            $ref: '#/components/schemas/Declaration'
        classes:
          type: array
          items:
            $ref: '#/components/schemas/Declaration'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    ModuleAnalysis:
      type: object
      required: [path, fileCount, failedFileCount, metrics]
      properties:
        path:
          type: string
        fileCount:
          type: integer
          minimum: 0
        failedFileCount:
          type: integer
          minimum: 0
        metrics:
          $ref: '#/components/schemas/Metrics'
    BatchAnalysis:
      type: object
      required: [files, modules]
      properties:
        files:
          type: array
          items:
            $ref: '#/components/schemas/FileAnalysis'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleAnalysis'
    FailureRecord:
      type: object
      required: [path, language, status, usedFallback, diagnostics, recordedAt]
      properties:
        path:
          type: string
        language:
          $ref: '#/components/schemas/SupportedLanguage'
        status:
          $ref: '#/components/schemas/FileAnalysisStatus'
        usedFallback:
          type: boolean
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
        recordedAt:
          type: string
          format: date-time
    GitHistoryRange:
      type: object
      additionalProperties: false
      properties:
        from:
          type: [string, 'null']
          format: date-time
        to:
          type: [string, 'null']
          format: date-time
    GitAnalysisRequest:
      type: object
      additionalProperties: false
      required: [repositoryPath]
      properties:
        repositoryPath:
          type: string
          description: Absolute local path to an existing Git worktree.
        history:
          $ref: '#/components/schemas/GitHistoryRange'
    GitFileMetrics:
      type: object
      required: [path, previousPaths, deleted, gitChurn, changeFrequency, authorCount, changeConcentration, changeDispersion]
      properties:
        path:
          type: string
        previousPaths:
          type: array
          items:
            type: string
        deleted:
          type: boolean
        gitChurn:
          type: integer
          minimum: 0
        changeFrequency:
          type: integer
          minimum: 0
        authorCount:
          type: integer
          minimum: 0
        firstChangedAt:
          type: [string, 'null']
          format: date-time
        lastChangedAt:
          type: [string, 'null']
          format: date-time
        changeConcentration:
          type: number
          minimum: 0
          maximum: 1
        changeDispersion:
          type: number
          minimum: 0
          maximum: 1
    GitAnalysisReport:
      type: object
      required: [commitCount, history, files, diagnostics]
      properties:
        commitCount:
          type: integer
          minimum: 0
        history:
          $ref: '#/components/schemas/GitHistoryRange'
        files:
          type: array
          items:
            $ref: '#/components/schemas/GitFileMetrics'
        diagnostics:
          type: array
          items:
            $ref: '#/components/schemas/Diagnostic'
    RiskMetric:
      type: string
      enum: [lines_of_code, max_function_length, max_class_length, git_churn, change_frequency]
    RiskLevel:
      type: string
      enum: [low, medium, high]
    HotspotMetrics:
      type: object
      required: [linesOfCode, maxFunctionLength, maxClassLength, gitChurn, changeFrequency]
      properties:
        linesOfCode:
          type: integer
          minimum: 0
        maxFunctionLength:
          type: integer
          minimum: 0
        maxClassLength:
          type: integer
          minimum: 0
        gitChurn:
          type: integer
          minimum: 0
        changeFrequency:
          type: integer
          minimum: 0
    HotspotInput:
      type: object
      required: [path, metrics]
      properties:
        path:
          type: string
        metrics:
          $ref: '#/components/schemas/HotspotMetrics'
    RiskBands:
      type: object
      required: [lowMax, mediumMax]
      properties:
        lowMax:
          type: integer
          minimum: 0
          maximum: 98
        mediumMax:
          type: integer
          minimum: 1
          maximum: 99
    RiskProfile:
      type: object
      required: [version, weights, bands]
      properties:
        version:
          type: string
        weights:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 1
        bands:
          $ref: '#/components/schemas/RiskBands'
    HeatmapConfiguration:
      type: object
      required: [xMetric, yMetric]
      properties:
        xMetric:
          $ref: '#/components/schemas/RiskMetric'
        yMetric:
          $ref: '#/components/schemas/RiskMetric'
    RiskAnalysisRequest:
      type: object
      additionalProperties: false
      required: [files]
      properties:
        files:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/HotspotInput'
        profile:
          $ref: '#/components/schemas/RiskProfile'
        heatmap:
          $ref: '#/components/schemas/HeatmapConfiguration'
        availableMetrics:
          type: array
          items:
            $ref: '#/components/schemas/RiskMetric'
    RiskContribution:
      type: object
      required: [metric, raw, normalizationCap, normalized, weight, weighted]
      properties:
        metric:
          $ref: '#/components/schemas/RiskMetric'
        raw:
          type: integer
        normalizationCap:
          type: integer
        normalized:
          type: number
        weight:
          type: number
        weighted:
          type: number
    Hotspot:
      type: object
      required: [path, module, metrics, score, level, rank, contributions]
      properties:
        path:
          type: string
        module:
          type: string
        metrics:
          $ref: '#/components/schemas/HotspotMetrics'
        score:
          type: integer
          minimum: 0
          maximum: 100
        level:
          $ref: '#/components/schemas/RiskLevel'
        rank:
          type: integer
          minimum: 1
        contributions:
          type: array
          items:
            $ref: '#/components/schemas/RiskContribution'
    ModuleHotspot:
      type: object
      required: [path, fileCount, score, level, highestFileScore]
      properties:
        path:
          type: string
        fileCount:
          type: integer
        score:
          type: integer
        level:
          $ref: '#/components/schemas/RiskLevel'
        highestFileScore:
          type: integer
    HeatmapCell:
      type: object
      required: [path, module, xValue, yValue, score, level, rank]
      properties:
        path:
          type: string
        module:
          type: string
        xValue:
          type: integer
        yValue:
          type: integer
        score:
          type: integer
        level:
          $ref: '#/components/schemas/RiskLevel'
        rank:
          type: integer
    HeatmapData:
      type: object
      required: [xMetric, yMetric, cells]
      properties:
        xMetric:
          $ref: '#/components/schemas/RiskMetric'
        yMetric:
          $ref: '#/components/schemas/RiskMetric'
        cells:
          type: array
          items:
            $ref: '#/components/schemas/HeatmapCell'
    RiskAnalysisReport:
      type: object
      required: [profile, requestedProfile, availableMetrics, unavailableMetrics, formula, normalization, limitations, files, modules, heatmap]
      properties:
        profile:
          $ref: '#/components/schemas/RiskProfile'
        requestedProfile:
          $ref: '#/components/schemas/RiskProfile'
        availableMetrics:
          type: array
          items:
            $ref: '#/components/schemas/RiskMetric'
        unavailableMetrics:
          type: array
          items:
            $ref: '#/components/schemas/RiskMetric'
        formula:
          type: string
        normalization:
          type: string
        limitations:
          type: array
          items:
            type: string
        files:
          type: array
          items:
            $ref: '#/components/schemas/Hotspot'
        modules:
          type: array
          items:
            $ref: '#/components/schemas/ModuleHotspot'
        heatmap:
          $ref: '#/components/schemas/HeatmapData'
